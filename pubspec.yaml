name: nitya_sadhana
description: "Nitya Sadhana – Your daily spiritual toolkit: japa counter, panchang, and direction compass."
publish_to: 'none'
version: 1.5.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  flutter_compass: ^0.8.1
  intl: ^0.20.2
  permission_handler: ^11.4.0
  sweph: ^3.2.1+2.10.3
  geolocator: ^14.0.2
  path_provider: ^2.1.5

  # Auth & IAP
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  purchases_flutter: ^8.6.0
  flutter_secure_storage: ^9.2.4

  # Audio
  audioplayers: ^6.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Charts
  fl_chart: ^0.70.2

  # Export
  csv: ^6.0.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.jpeg"
  adaptive_icon_background: "#FFF8F0"
  adaptive_icon_foreground: "assets/app_icon.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/panchang/
    - assets/audio/
