name: nitya_sadhana
description: "Nitya Sadhana – Your daily spiritual toolkit: japa counter, panchang, and direction compass."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  flutter_compass: ^0.8.1
  intl: ^0.20.2
  permission_handler: ^12.0.3
  sweph: ^3.2.1+2.10.3
  geolocator: ^14.0.2
  path_provider: ^2.1.5

  # Audio
  audioplayers: ^6.7.1

  # Subscriptions
  purchases_flutter: ^8.9.0

  # Ads
  google_mobile_ads: ^5.3.0

  # Firebase + Auth
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  firebase_app_check: ^0.3.2+10
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

  # Notifications
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1

  # Charts
  fl_chart: ^1.2.0

  # Export
  csv: ^6.0.0
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.jpeg"
  adaptive_icon_background: "#FFF8F0"
  adaptive_icon_foreground: "assets/app_icon.jpeg"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/panchang/
    - assets/sounds/
