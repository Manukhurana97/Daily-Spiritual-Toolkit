name: nitya_sadhana
description: "Nitya Sadhana – Your daily spiritual toolkit: japa counter, panchang, and direction compass."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  flutter_compass: ^0.8.1
  intl: ^0.20.2
  permission_handler: ^11.4.0
  sweph: ^3.2.1+2.10.3
  geolocator: ^14.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.jpeg"
  adaptive_icon_background: "#FFF8F0"
  adaptive_icon_foreground: "assets/app_icon.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/panchang/
